# Post-merge checks. Deliberately NOT required on PRs: a 10-minute gate would
# serialize 20 agents behind the merge queue (docs/PARALLEL-AGENTS.md §3).
# A red run here means the owning workstream fixes forward, fast.
name: main-checks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-checks
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: start infrastructure
        # minio-init is a one-shot container; `--wait` errors on services that
        # exit, so wait on the long-running four and run the init job explicitly.
        run: |
          docker compose up -d --wait postgres redis minio mailpit
          docker compose up minio-init

      - run: cp .env.example .env
      - run: pnpm db:setup
      # playwright lives in the e2e workspace package, not the root — a root
      # `pnpm exec playwright` finds no binary.
      - run: pnpm --filter @merchant/e2e exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin, storefront, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
