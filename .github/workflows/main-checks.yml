# Post-merge checks. Deliberately NOT required on PRs: a 10-minute gate would
# serialize 20 agents behind the merge queue (docs/PARALLEL-AGENTS.md §3).
# A red run here means the owning workstream fixes forward, fast.
name: main-checks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-checks
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: start infrastructure
        # minio-init is a one-shot container; `--wait` errors on services that
        # exit, so wait on the long-running four and run the init job explicitly.
        run: |
          docker compose up -d --wait postgres redis minio mailpit
          docker compose up minio-init

      - run: cp .env.example .env
      - run: pnpm db:setup
      # playwright lives in the e2e workspace package, not the root — a root
      # `pnpm exec playwright` finds no binary.
      - run: pnpm --filter @merchant/e2e exec playwright install --with-deps chromium
      - run: pnpm build
      # The browser maps *.lvh.me → 127.0.0.1 via --host-resolver-rules, but
      # the storefront's SSR fetches {slug}.lvh.me:3001 through the RUNNER's
      # resolver — and "public name that answers 127.0.0.1" is exactly what
      # DNS-rebind filters drop. Serve the wildcard locally instead of trusting
      # the network; dnsmasq forwards everything else to systemd-resolved.
      - name: resolve *.lvh.me locally
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsmasq
          printf 'listen-address=127.0.0.2\nbind-interfaces\naddress=/lvh.me/127.0.0.1\nserver=127.0.0.53\n' | sudo tee /etc/dnsmasq.d/lvh.conf
          sudo systemctl restart dnsmasq
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 127.0.0.2\n' | sudo tee /etc/resolv.conf
          getent hosts smoke-test-wildcard.lvh.me
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The default GITHUB_TOKEN is enough for GHCR — no extra secret (A5).
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin, storefront, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed as ghcr.io/{owner}/{repo}/{app}:{sha} + :latest, which is what
      # docker-compose.prod.yml pulls by default. The admin image bakes its
      # public URLs at build time (see apps/admin/Dockerfile), so these images
      # carry the dev defaults — a real domain rebuilds admin via the compose
      # file's build args.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
